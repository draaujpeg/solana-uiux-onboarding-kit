<svg width="1200" height="600" viewBox="0 0 1200 600" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Solana UI/UX Onboarding Kit. Install with npx skills add draaujpeg/solana-uiux-onboarding-kit. Installed for Claude Code, Cursor, Codex, and more.">
  <defs>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#ffffff" fill-opacity="0.035" />
    </pattern>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9945ff" />
      <stop offset="1" stop-color="#14f195" />
    </linearGradient>
    <linearGradient id="glow" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#9945ff" stop-opacity="0.10" />
      <stop offset="1" stop-color="#0b0d12" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- backdrop -->
  <rect width="1200" height="600" fill="#0b0d12" />
  <rect width="1200" height="600" fill="url(#dots)" />
  <rect width="1200" height="360" fill="url(#glow)" />

  <!-- wordmark, centered: two stacked bars in the Solana gradient + name -->
  <g transform="translate(414 84)">
    <path d="M4 3 L34 3 L28 11 L-2 11 Z" fill="url(#accent)" />
    <path d="M4 17 L34 17 L28 25 L-2 25 Z" fill="url(#accent)" opacity="0.85" />
    <text x="50" y="21" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="24" font-weight="600" fill="#f4f6fb">Solana UI/UX Onboarding Kit</text>
  </g>

  <!-- terminal window -->
  <g transform="translate(240 176)">
    <rect x="0" y="0" width="720" height="248" rx="14" fill="#12151c" stroke="#242832" stroke-width="1" />
    <!-- title bar dots -->
    <circle cx="32" cy="34" r="6.5" fill="#ff5f56" />
    <circle cx="56" cy="34" r="6.5" fill="#ffbd2e" />
    <circle cx="80" cy="34" r="6.5" fill="#27c93f" />
    <line x1="0" y1="64" x2="720" y2="64" stroke="#242832" stroke-width="1" />

    <!-- command -->
    <text font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19">
      <tspan x="40" y="122" fill="#6b7482">$</tspan>
      <tspan x="66" y="122" fill="#e8ebf1">npx skills add draaujpeg/solana-uiux-onboarding-kit</tspan>
    </text>
    <!-- result -->
    <text font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19">
      <tspan x="40" y="164" fill="#14f195">&#10003;</tspan>
      <tspan x="66" y="164" fill="#a7b0be">installed for Claude Code, Cursor, Codex, and more</tspan>
    </text>
    <!-- cursor block, static -->
    <rect x="40" y="196" width="11" height="20" rx="1.5" fill="#3a3f4b" />
  </g>

  <!-- caption -->
  <text x="600" y="486" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="21" fill="#8b93a1">Find where your onboarding loses users, and install the fix.</text>
</svg>
