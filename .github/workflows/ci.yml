name: CI

# Runs on every pull request and on pushes to main.
# Three checks: Markdown style, broken links, and the component library.
on:
  pull_request:
  push:
    branches: [main]

# Least-privilege: the jobs only need to read the repository.
permissions:
  contents: read

jobs:
  markdownlint:
    name: Markdown style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Lint Markdown
        run: npx -y markdownlint-cli2

  links:
    name: Link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: "--no-progress --accept 200,206,429 './**/*.md'"
          fail: true

  # The components live in skills/solana-onboarding/components and are rendered
  # by the demo app, which imports them rather than copying them. Building the
  # demo therefore type-checks and compiles the components themselves: this job
  # is the compile checkpoint the build plan relies on, so that "it worked on my
  # machine" stops being the only evidence.
  app:
    name: Component library
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: demo/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build and type-check
        run: npm run build
